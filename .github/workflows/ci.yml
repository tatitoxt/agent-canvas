name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  canvasd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  # End-to-end: boot a real canvasd + the built web client and drive the
  # app through Playwright (spawn chooser, panels, vault CRUD).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p canvasd
      - run: npm ci
        working-directory: web
      - run: npx vite build
        working-directory: web
      - run: npx playwright install chromium --with-deps
        working-directory: web
      - run: npm run e2e
        working-directory: web

  # The Tauri shell needs a real GUI platform — verify it compiles for the
  # platforms we actually ship on (macOS first; windows/ubuntu follow).
  tauri-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo check
        working-directory: src-tauri

  # Same check on Linux: the GTK/WebKitGTK system libs are the part that
  # actually varies, so install them exactly as the build guide says.
  tauri-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev pkg-config file
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo check
        working-directory: src-tauri
