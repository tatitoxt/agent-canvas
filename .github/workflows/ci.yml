name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  canvasd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  # Compile-gate the daemon on Windows: unix signal usage and PTY shell
  # setup are cfg-gated, and this job keeps them from regressing before
  # the tag-only Windows release build.
  canvasd-windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      # The vitest unit suite (85 tests) must gate the build: typecheck
      # alone does not catch behavioral regressions in stores/parsers.
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  # End-to-end: boot a real canvasd + the built web client and drive the
  # app through Playwright (spawn chooser, panels, vault CRUD).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p canvasd
      - run: npm ci
        working-directory: web
      - run: npx vite build
        working-directory: web
      - run: npx playwright install chromium --with-deps
        working-directory: web
      - run: npm run e2e
        working-directory: web
      # Failure forensics: playwright writes an error-context.md (page
      # snapshot) plus screenshots per failed attempt into test-results.
      # Without this upload the CI log is the only evidence and opaque
      # 45s test timeouts are undebuggable.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The Tauri shell needs a real GUI platform — verify it compiles for the
  # platforms we actually ship on (macOS first; windows/ubuntu follow).
  tauri-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo check
        working-directory: src-tauri

  # Same check on Linux: the GTK/WebKitGTK system libs are the part that
  # actually varies, so install them exactly as the build guide says.
  # This job also runs the src-tauri unit tests (repo explorer + vault
  # write-asset sandbox): the shell is excluded from the cargo workspace,
  # so `cargo test --workspace` never reaches it, and `cargo test` here
  # subsumes the compile gate while exercising the security-critical path
  # logic. Ubuntu over macOS because the suite is platform-independent
  # filesystem logic (the unix-only symlink test included) and ubuntu
  # minutes are the cheap ones.
  tauri-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev pkg-config file
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # cargo test compiles and links the whole crate — a superset of the
      # old cargo check gate — then runs the unit suite.
      - run: cargo test
        working-directory: src-tauri
