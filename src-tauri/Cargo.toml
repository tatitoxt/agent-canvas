[package]
name = "canvas-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agent canvas — spatial board of live CLI coding agents"
default-run = "canvas-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
canvasd = { path = "../crates/canvasd" }
# The embedded share/export server: already in the dependency graph through
# canvasd, so this adds no new transitive crates — share-by-link needs a
# real HTTP endpoint a browser can open, and axum is what the daemon uses.
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[features]
# Tauri requires a `custom-protocol` feature for production builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
